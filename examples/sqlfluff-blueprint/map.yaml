doc_discrepancies:
  - doc: docs/source/production/cli_use.rst:18-20
    says: "Exit 2, örneğin SQLFluff içindeki bir iç hata anlamına gelir"
    code: src/sqlfluff/core/linter/runner.py:100-109
    actually: "Dosya işlenirken oluşan iç hata yalnızca uyarı loglar ve dosyayı atlar; diğer dosyalar temizse çıkış 0 (gözlemlendi)"
  - doc: src/sqlfluff/cli/commands.py:688
    says: "--write-output: bir çıktı dosyası belirlemek normal stdout loglamasını yeniden açar"
    code: src/sqlfluff/cli/commands.py:765
    actually: "--write-output verilince non_human_output=True olur ve loglar stderr'e gider; gözlemde stdout tamamen boştu"
  - doc: docs/source/configuration/ignoring_configuration.rst:114
    says: "Hata kategorileri --ignore ya da .sqlfluffignore içindeki `ignore` ayarıyla yok sayılabilir"
    code: src/sqlfluff/core/linter/discovery.py:68-73
    actually: ".sqlfluffignore yalnız gitignore desenleri olarak okunur; `ignore` bir config (.sqlfluff vb.) anahtarıdır"
  - doc: docs/source/configuration/ignoring_configuration.rst:88-91
    says: "ignore_paths pyproject.toml'un [tool.sqlfluff.core] bölümünde kullanılabilir"
    code: src/sqlfluff/core/linter/discovery.py:109-113
    actually: "ignore_paths .sqlfluff dosyasının [sqlfluff] bölümünden de okunur (belgelenmemiş); setup.cfg/tox.ini'den okunmaz"
  - doc: src/sqlfluff/core/config/loader.py:286
    says: "ignore_local_config yalnız ev dizini (~) ve appdir config'ini atlar"
    code: src/sqlfluff/core/config/loader.py:306-325
    actually: "Ebeveyn dizinler ve cwd->dosya dizini config'leri de atlanır (cwd'deki .sqlfluff yok sayıldı, gözlemlendi). Aynı docstring fluffconfig.py:63, :293, :400'de tekrar eder"
  - doc: docs/source/configuration/setting_configuration.rst:146-148
    says: "macOS ve Unix'te kullanıcı config dizini ~/.config/sqlfluff"
    code: src/sqlfluff/core/config/loader.py:66-104
    actually: "~/.config/sqlfluff yoksa macOS'ta XDG unix yolu, o da yoksa platformdirs macOS yolu (~/Library/Application Support/...) kullanılır"
  - doc: docs/source/configuration/setting_configuration.rst:8-9
    says: "Şablonlama config'i yalnız dosya ile yapılabilir"
    code: src/sqlfluff/cli/commands.py:415
    actually: "--library-path CLI bayrağı jinja library_path'i override eder"
  - doc: src/sqlfluff/core/default_config.cfg:8
    says: "verbose 0-2 arası bir tamsayı"
    code: src/sqlfluff/cli/commands.py:213-228
    actually: "Log seviyeleri verbosity 3, 4 ve >4 için ayrıca değişir"
  - doc: src/sqlfluff/core/default_config.cfg:15
    says: "templater [raw|jinja|python|placeholder] değerlerinden biri"
    code: src/sqlfluff/core/config/fluffconfig.py:473-510
    actually: "get_templaters hook'u ile gelen eklenti templater'ları (dbt, sqlmesh) da geçerli"
  - doc: AGENTS.md:135
    says: "Yeni kural için metadata olarak `code`, `name`, `description`, `groups` tanımla"
    code: src/sqlfluff/core/rules/base.py:201-211
    actually: "code sınıf adından (Rule_XXNN) ve description docstring'in ilk satırından metaclass tarafından üretilir ve üzerine yazılır; elle tanımlanan değerler kullanılmaz"
  - doc: AGENTS.md:137
    says: "YAML test vakaları test/fixtures/rules/std_rule_cases/<category>.yml dosyasına eklenir (test/AGENTS.md:230, :441 aynı)"
    code: test/rules/yaml_test_cases_test.py:22
    actually: "Dosyalar kural kodu adlıdır (AL01.yml, AL02_LT01.yml); kategori adlı dosya yok; hangi kural olduğu `rule:` anahtarından okunur"
  - doc: src/sqlfluff/AGENTS.md:245
    says: "FluffConfig.from_root() varsayılan dialekti 'ansi' döner"
    code: src/sqlfluff/core/default_config.cfg:14
    actually: "Varsayılan dialect None; from_root() require_dialect=True iken dialekt yoksa SQLFluffUserError verir"

