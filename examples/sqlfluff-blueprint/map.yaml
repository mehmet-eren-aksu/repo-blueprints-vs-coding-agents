# SQLFluff uyarlama haritası (blueprint/0.2). Tek doğruluk kaynağı.
# Anahtarlar İngilizce, açıklamalar Türkçe. Yollar repo köküne göredir.
# Not: Kod yazımı ve test komutları için AGENTS.md dosyalarına bakın;
# bu harita onların söylemediği davranış ve bağlantılara odaklanır.

summary: "SQLFluff, SQL dosyalarını şablonlayıp (jinja/python/placeholder/raw ya da eklenti), seçilen dialektin grammar'ıyla lexleyip parse eden, segment ağacı üzerinde kurallar çalıştırıp ihlal raporlayan ve düzeltmeleri kaynak dosyaya geri yamalayan dialekt-esnek bir linter/formatlayıcıdır."

entrypoints:
  - where: pyproject.toml:114
    what: "`sqlfluff` konsol komutu -> sqlfluff.cli.commands:cli"
  - where: src/sqlfluff/cli/commands.py:611
    what: "click grubu; alt komutlar lint (718), fix (1431), format (1547), parse (1731), render (1879), rules (632), dialects (654), version"
  - where: src/sqlfluff/__main__.py:1
    what: "`python -m sqlfluff` -> aynı cli"
  - where: src/sqlfluff/api/simple.py:74
    what: "Python API: lint() (74), fix() (115), parse() (168); Linter'ı string üzerinde sarar"
  - where: src/sqlfluff/core/linter/linter.py:58
    what: "Linter sınıfı; programatik ana giriş (lint_paths, lint_string, parse_string, render_string)"
  - where: pyproject.toml:116
    what: "diff_cover eklentisi -> src/sqlfluff/diff_quality_plugin.py (diff-quality entegrasyonu)"
  - where: pyproject.toml:119
    what: "pluggy entry-point grubu `sqlfluff`; çekirdek kurallar ve templater'lar da bu yoldan yüklenir"

pipeline:
  - id: P1
    stage: config-root
    what: "CLI bayrakları override sözlüğüne çevrilir; FluffConfig.from_root cwd'den config yükler, varsayılanlar eklentilerden (load_default_config) gelir, dialekt ve templater nesneleri kurulur"
    where: [src/sqlfluff/cli/commands.py:505, src/sqlfluff/core/config/fluffconfig.py:279, src/sqlfluff/core/config/fluffconfig.py:125]
  - id: P2
    stage: discovery
    what: "Yollar dosyalara açılır; uzantı filtresi (sql_file_exts, kök config) ve .sqlfluffignore / ignore_paths uygulanır; dizin sonuçları sıralanır"
    where: [src/sqlfluff/core/linter/linter.py:1162, src/sqlfluff/core/linter/discovery.py:245]
  - id: P3
    stage: runner
    what: "processes değerine göre Sequential/MultiProcess/MultiThread runner seçilir; templater.sequence_files dosya sırasını belirleyebilir"
    where: [src/sqlfluff/core/linter/runner.py:370, src/sqlfluff/core/linter/runner.py:49]
  - id: P4
    stage: load-file
    what: "Dosyaya özel çocuk config (make_child_from_path), encoding tespiti, bayt boyut sınırı, okuma (backslashreplace) ve dosya içi `-- sqlfluff:` direktifleri"
    where: [src/sqlfluff/core/linter/linter.py:122, src/sqlfluff/core/config/fluffconfig.py:759]
  - id: P5
    stage: templating
    what: "Satır sonları \\n'e normalize edilir; templater.process_with_variants en fazla render_variant_limit TemplatedFile üretir; ölümcül şablon hatası TMP ihlali olur"
    where: [src/sqlfluff/core/linter/linter.py:921, src/sqlfluff/core/templaters/base.py:583]
  - id: P6
    stage: lexing
    what: "Her varyant dialektin lexer matcher'larıyla lexlenir (PyLexer ya da kuruluysa Rust lexer); eşleşmeyen karakterler UnlexableSegment + LXR olur; şablon blok girinti metası dengelenir"
    where: [src/sqlfluff/core/linter/linter.py:170, src/sqlfluff/core/parser/lexer.py:765]
  - id: P7
    stage: parsing
    what: "max_parse_nodes kontrolü; Python Parser ya da RustParser; kök FileSegment.root_parse grammar'ı eşleştirir, eşleşmeyen kod UnparsableSegment olur; her unparsable bölüm için PRS ihlali"
    where: [src/sqlfluff/core/linter/linter.py:228, src/sqlfluff/core/parser/parser.py:30, src/sqlfluff/core/parser/segments/file.py:44]
  - id: P8
    stage: rule-loop
    what: "RulePack (sıralı kurallar) ağaç üzerinde crawl edilir; noqa maskesi uygulanır; fix modunda runaway_limit kadar main + 2 post döngüsü, her kuralın fix'leri apply_fixes ile uygulanır"
    where: [src/sqlfluff/core/linter/linter.py:457, src/sqlfluff/core/rules/base.py:518, src/sqlfluff/core/linter/fix.py:107]
  - id: P9
    stage: aggregate
    what: "Kök + alternatif varyant sonuçları birleşir; ignore/warnings işaretlenir; kaynak uzayında tekilleştirilip sıralanır -> LintedFile"
    where: [src/sqlfluff/core/linter/linter.py:711, src/sqlfluff/core/linter/linter.py:842]
  - id: P10
    stage: patch-persist
    what: "Düzeltilmiş ağaçtan kaynak yamaları üretilir, varyantlar arasında birleşir, kaynak dizgesine uygulanır; fix'te geçici dosya üzerinden yazılır"
    where: [src/sqlfluff/core/linter/patch.py:271, src/sqlfluff/core/linter/linted_file.py:195, src/sqlfluff/core/linter/linted_file.py:390]
  - id: P11
    stage: report-exit
    what: "LintedDir kayıt ve sayaçları tutar; CLI formatı (human/json/yaml/sarif/github/gitlab/none) seçilir; çıkış kodu ihlal sayısından türetilir"
    where: [src/sqlfluff/core/linter/linted_dir.py:63, src/sqlfluff/cli/commands.py:829, src/sqlfluff/core/linter/linting_result.py:119]

modules:
  - path: src/sqlfluff/core/parser/
    role: "Dialektten bağımsız parse motoru: lexer motoru, grammar kombinatörleri (Sequence/OneOf/Delimited/Bracketed/Ref...), eşleştirme algoritmaları, segment ağacı, konum işaretçileri"
    layer: core
    depends_on: [src/sqlfluff/core/config/, src/sqlfluff/core/errors.py, src/sqlfluff/core/templaters/base.py]
  - path: src/sqlfluff/core/parser/rust_parser.py
    role: "sqlfluffrs varsa Rust parse sonucunu (MatchResult) Python segment ağacına çeviren köprü; yoksa RustParser=None"
    layer: core
    depends_on: [sqlfluffrs/, src/sqlfluff/core/parser/]
  - path: src/sqlfluff/core/dialects/base.py
    role: "Dialect sınıfı: segment/grammar kütüphanesi, add/replace, copy_as kalıtımı, expand, lexer matcher yamaları, keyword set'leri"
    layer: core
    depends_on: [src/sqlfluff/core/parser/]
  - path: src/sqlfluff/core/dialects/__init__.py
    role: "Dialekt kayıt tablosu ve tembel yükleyici (dialect_selector, load_raw_dialect, dialect_readout)"
    layer: mixed
    domain_lines: [src/sqlfluff/core/dialects/__init__.py:23-64]
    depends_on: [src/sqlfluff/dialects/]
  - path: src/sqlfluff/core/dialects/common.py
    role: "Nesne referansı / alias yardımcıları; dialekt adı + segment türüne göre dispatch"
    layer: mixed
    domain_lines: [src/sqlfluff/core/dialects/common.py:133-210, src/sqlfluff/core/dialects/common.py:243-350]
    depends_on: [src/sqlfluff/core/parser/]
  - path: src/sqlfluff/dialects/
    role: "28 dialekt modülü + keyword dosyaları (aile; bkz. E1). ~94k satır, kodun en büyük kısmı"
    layer: domain
    depends_on: [src/sqlfluff/core/dialects/, src/sqlfluff/core/parser/]
  - path: src/sqlfluff/core/templaters/base.py
    role: "RawTemplater arayüzü, TemplatedFile (kaynak<->şablonlanmış kesit eşlemesi), büyük dosya karakter sınırı"
    layer: core
    depends_on: [src/sqlfluff/core/config/, src/sqlfluff/core/errors.py]
  - path: src/sqlfluff/core/templaters/
    role: "Somut templater'lar: jinja.py, python.py, placeholder.py, slicers/ (jinja izleme ile kesit çıkarımı)"
    layer: domain
    depends_on: [src/sqlfluff/core/templaters/base.py]
  - path: src/sqlfluff/core/linter/
    role: "Orkestrasyon: Linter, runner'lar, fix uygulama, kaynak yamaları, sonuç kapları (LintedFile/LintedDir/LintingResult)"
    layer: core
    depends_on: [src/sqlfluff/core/parser/, src/sqlfluff/core/rules/, src/sqlfluff/core/templaters/, src/sqlfluff/core/config/]
  - path: src/sqlfluff/core/linter/discovery.py
    role: "Yol genişletme, uzantı eşleme, ignore dosyaları (gitignore semantiği, pathspec)"
    layer: mixed
    domain_lines: [src/sqlfluff/core/linter/discovery.py:109-113]
    depends_on: [src/sqlfluff/core/config/file.py]
  - path: src/sqlfluff/core/config/
    role: "Config bulma, ini/toml okuma, yol çözümleme, doğrulama, kaldırılmış anahtar çevirisi, FluffConfig"
    layer: mixed
    domain_lines: [src/sqlfluff/core/config/file.py:27-35, src/sqlfluff/core/config/toml.py:58-64, src/sqlfluff/core/config/fluffconfig.py:500-505]
    depends_on: [src/sqlfluff/core/plugin/, src/sqlfluff/core/helpers/]
  - path: src/sqlfluff/core/default_config.cfg
    role: "Tüm varsayılanlar: core, indentation, segment türüne göre layout (62 bölüm), templater, kural ayarları"
    layer: domain
    depends_on: []
  - path: src/sqlfluff/core/rules/
    role: "Kural çerçevesi: BaseRule (metaclass ile kod/açıklama), crawler'lar, RuleSet/RulePack seçimi, LintFix, LintResult, noqa"
    layer: core
    depends_on: [src/sqlfluff/core/parser/, src/sqlfluff/core/plugin/]
  - path: src/sqlfluff/core/rules/noqa.py
    role: "noqa direktiflerini ayrıştırma ve maskeleme"
    layer: mixed
    domain_lines: [src/sqlfluff/core/rules/noqa.py:74-80, src/sqlfluff/core/rules/noqa.py:151-160]
    depends_on: [src/sqlfluff/core/parser/]
  - path: src/sqlfluff/core/plugin/
    role: "pluggy host: entry-point keşfi, hookspec'ler (get_rules, load_default_config, get_configs_info), çekirdek hookimpl'ler (lib.py)"
    layer: core
    depends_on: [src/sqlfluff/core/rules/, src/sqlfluff/core/templaters/]
  - path: src/sqlfluff/core/errors.py
    role: "İhlal türleri (TMP/LXR/PRS/kural kodu/NOQA), ignore/warning işaretleme, kaynak imzası"
    layer: core
    depends_on: []
  - path: src/sqlfluff/core/formatter.py
    role: "FormatterInterface: çekirdeğin CLI'ye çıktı gönderdiği soyut arayüz"
    layer: core
    depends_on: []
  - path: src/sqlfluff/core/helpers/
    role: "dict/string/slice/file yardımcıları (encoding tespiti, ara yol üretimi)"
    layer: core
    depends_on: []
  - path: src/sqlfluff/rules/
    role: "79 standart kural, 11 paket (aile; bkz. E2)"
    layer: domain
    depends_on: [src/sqlfluff/core/rules/, src/sqlfluff/utils/]
  - path: src/sqlfluff/utils/reflow/
    role: "Boşluk/satır kırma/girinti motoru (LT kuralları kullanır); config'i segment türlerine göre okur"
    layer: mixed
    domain_lines: [src/sqlfluff/utils/reflow/sequence.py:620-620, src/sqlfluff/utils/reflow/reindent.py:1613-1613, src/sqlfluff/utils/reflow/reindent.py:2418-2418]
    depends_on: [src/sqlfluff/core/rules/, src/sqlfluff/core/parser/]
  - path: src/sqlfluff/utils/analysis/
    role: "SELECT/CTE/sorgu yapısı analizi (AL/RF/ST kuralları kullanır)"
    layer: domain
    depends_on: [src/sqlfluff/core/dialects/common.py]
  - path: src/sqlfluff/utils/functional/
    role: "Segment koleksiyonları için fonksiyonel sorgu yardımcıları"
    layer: core
    depends_on: [src/sqlfluff/core/parser/]
  - path: src/sqlfluff/utils/testing/
    role: "Kural/CLI/YAML test yardımcıları (eklenti yazarları için testutils)"
    layer: core
    depends_on: [src/sqlfluff/core/]
  - path: src/sqlfluff/cli/
    role: "click komutları, seçenekler, çıktı politikası ve akışları, insan formatlayıcı"
    layer: mixed
    domain_lines: [src/sqlfluff/cli/commands.py:829-1074]
    depends_on: [src/sqlfluff/core/]
  - path: src/sqlfluff/api/
    role: "İnce Python API cephesi (simple.py) ve bilgi fonksiyonları (info.py)"
    layer: core
    depends_on: [src/sqlfluff/core/]
  - path: plugins/sqlfluff-templater-dbt/
    role: "dbt templater eklentisi (JinjaTemplater alt sınıfı, ana süreçte şablonlar)"
    layer: domain
    depends_on: [src/sqlfluff/core/templaters/]
  - path: plugins/sqlfluff-templater-sqlmesh/
    role: "sqlmesh templater eklentisi"
    layer: domain
    depends_on: [src/sqlfluff/core/templaters/]
  - path: plugins/sqlfluff-plugin-example/
    role: "Örnek kural eklentisi (get_rules, load_default_config, get_configs_info)"
    layer: domain
    depends_on: [src/sqlfluff/core/plugin/]
  - path: sqlfluffrs/
    role: "Deneysel Rust lexer/parser/kurallar (Cargo workspace); dialekt tabloları Python dialektlerinden üretilir (sqlfluffrs/AGENTS.md)"
    layer: mixed
    domain_lines: [sqlfluffrs/tests/fixture_tests.rs:1-2303]
    depends_on: [utils/rustify.py, src/sqlfluff/dialects/]

# Büyük repo kuralı: tekrarlayan aileler tek kalıp olarak.
families:
  - id: F1
    name: dialects
    interface: "Modül düzeyinde `<ad>_dialect = load_raw_dialect('<ebeveyn>').copy_as(name, formatted_name, docstring)`; aynı adlı BaseSegment alt sınıfları otomatik replace/add edilir (core/dialects/__init__.py:76)"
    members: "src/sqlfluff/dialects/dialect_*.py (28 dialekt, _dialect_lookup: core/dialects/__init__.py:23)"
    inheritance: "ansi -> {athena, bigquery, clickhouse, db2, exasol, flink, hive, mysql, oracle, postgres, snowflake, soql, sparksql, sqlite, teradata, trino, tsql, vertica}; postgres -> {duckdb, greenplum, materialize, redshift}; mysql -> {mariadb, doris, starrocks}; hive -> impala; sparksql -> databricks"
    representative: "src/sqlfluff/dialects/dialect_sqlite.py (1324 satır): copy_as 43, patch_lexer_matchers 66, insert_lexer_matchers 114, add 164, replace 206"
    checklist: E1
    outliers:
      - "ansi kendisi Dialect(...) ile sıfırdan kurulur ve lexer'ı tanımlar (dialect_ansi.py:74)"
      - "Birden çok ebeveynden grammar ödünç alanlar: duckdb (ansi+postgres), redshift (postgres+ansi), sparksql (ansi+hive)"
      - "_legacy_dialects: exasol_fs ve spark3 adları yönlendirme hatası verir (core/dialects/__init__.py:54)"
      - "Yalnız tsql için ayrıntılı ajan talimatı var: src/sqlfluff/dialects/dialect_instructions/tsql.md"
  - id: F2
    name: rules
    interface: "class Rule_<KOD>(BaseRule) + paket __init__.py'de @hookimpl get_rules() (tembel import) ve isteğe bağlı get_configs_info(); _eval(context) -> LintResult | list[LintResult] | None"
    members: "src/sqlfluff/rules/<paket>/<KOD>.py; 79 kural: aliasing 10, ambiguous 9, capitalisation 5, convention 13, jinja 1, layout 15, oracle 1, postgres 2, references 7, structure 12, tsql 4"
    representative: "src/sqlfluff/rules/layout/LT01.py (71 satır): name 53, groups 64, RootOnlyCrawler 65, is_fix_compatible 66; mantık utils/reflow'a devredilir"
    checklist: E2
    outliers:
      - "lint_phase='post': CP01-CP05, LT12, LT13"
      - "is_fix_compatible=False (yalnız raporlar): AL03, AL04, AL06, AL08, AL10, AM01, AM04, AM06, AM07, AM09, CV08, CV09, CV13, PG01, PG02, RF01, RF02, RF04, RF05, RF07, ST03, ST10, ST11, TQ01"
      - "targets_templated=True: CV10, JJ01, LT02, LT05, LT12, LT13; template_safe_fixes=True: LT02, LT05"
      - "Kalıtım: CP02 Rule_CP01'den türer (groups/config_keywords metaclass ile miras, base.py:333-351)"
      - "Dialekte özel kurallar paket adıyla değil _eval içindeki dialect.name kontrolüyle kısıtlanır (TQ01.py:64, PG01.py:72, OR01.py:46)"
      - "CP01, CP03, CP04 için Rust _eval_rust yolu var (use_rust_rules)"
      - "Crawler dağılımı: 68 SegmentSeekerCrawler, 11 RootOnlyCrawler"
  - id: F3
    name: templaters
    interface: "RawTemplater alt sınıfı; name; process/process_with_variants; get_templaters hookimpl"
    members: "core_templaters (templaters/__init__.py:13): raw, jinja, python, placeholder; eklentiler: dbt (plugins/sqlfluff-templater-dbt), sqlmesh (plugins/sqlfluff-templater-sqlmesh)"
    representative: "src/sqlfluff/core/templaters/placeholder.py (PlaceholderTemplater, name 78, process 119)"
    checklist: E3
    outliers:
      - "JinjaTemplater PythonTemplater'dan türer ve çoklu varyant üretir (jinja.py:93, :1117)"
      - "DbtTemplater templates_in_worker=False (ana süreçte manifest gerekir) ve sequence_files'ı override eder (templater.py:179, :462)"
  - id: F4
    name: output-formats
    interface: "LintingResult.as_records() -> list[LintingRecord]; lint komutunda format başına bir dal"
    members: "FormatType: human, json, yaml, sarif, github-annotation, github-annotation-native, gitlab, none (core/types.py:20)"
    representative: "gitlab dalı (cli/commands.py:1018): annotation_level -> severity eşlemesi, md5 fingerprint"
    checklist: E4
    outliers:
      - "human formatı serileştirici değil, formatter üzerinden akış halinde yazılır (cli/formatters.py)"
      - "parse komutu yalnız human/json/yaml/none destekler"

# Büyük repo kuralı: uzun çekirdek modüllerin iç haritası.
internals:
  - module: src/sqlfluff/core/linter/linter.py
    functions:
      - name: load_raw_file_and_config
        where: src/sqlfluff/core/linter/linter.py:122
        decides: "dosya config'i, encoding, bayt sınırı (SQLFluffSkipFile), inline config"
      - name: render_string
        where: src/sqlfluff/core/linter/linter.py:921
        decides: "newline normalizasyonu, dialekt zorunluluğu, templater uyuşmazlık uyarısı, varyant sınırı, ölümcül TMP"
      - name: _lex_templated_file
        where: src/sqlfluff/core/linter/linter.py:170
        decides: "şablon blok girinti dengesi; dengesizse girinti metaları atılır"
      - name: _parse_tokens
        where: src/sqlfluff/core/linter/linter.py:228
        decides: "max_parse_nodes, Rust/Python parser seçimi, SQLParseError -> ağaçsız PRS, unparsable -> PRS"
      - name: parse_rendered
        where: src/sqlfluff/core/linter/linter.py:399
        decides: "her varyant için lex+parse, zamanlamalar -> ParsedString"
      - name: lint_fix_parsed
        where: src/sqlfluff/core/linter/linter.py:457
        decides: "noqa maskesi, main/post fazları, döngü sınırı, fix geçerlilik ve döngü tespiti, templated hata filtresi"
      - name: lint_parsed
        where: src/sqlfluff/core/linter/linter.py:711
        decides: "kök vs alternatif varyantlar, kaynak yama birleşimi, ağaçsız durumda kaynaktan noqa, ignore/warnings işaretleme, tekilleştirme, dialekt uyarısı"
      - name: lint_paths
        where: src/sqlfluff/core/linter/linter.py:1141
        decides: "keşif, runner seçimi, fatal'da durma, dosya başına anında persist (apply_fixes)"
    flow: "lint_paths -> runner.run -> iter_partials -> render_file(load_raw_file_and_config -> render_string) -> lint_rendered -> parse_rendered(_lex_templated_file, _parse_tokens) -> lint_parsed -> lint_fix_parsed -> BaseRule.crawl / apply_fixes -> LintedFile -> (persist_tree)"
    change_points:
      - "Yeni bir lint aşaması (ör. kural sonrası filtre): lint_fix_parsed sonu (linter.py:701) ya da lint_parsed ignore döngüsü (linter.py:841)"
      - "Yeni parse ön kontrolü: _parse_tokens başı (linter.py:235)"
      - "Yeni dosya düzeyi atlama koşulu: load_raw_file_and_config (SQLFluffSkipFile) -> runner sayar"
      - "Fix davranışı: lint_fix_parsed içindeki apply_fixes dalı (linter.py:610-666)"
  - module: src/sqlfluff/core/rules/base.py
    functions:
      - name: RuleMetaclass.__new__
        where: src/sqlfluff/core/rules/base.py:324
        decides: "groups/config_keywords mirası, docstring zenginleştirme, kod/açıklama üretimi, ad doğrulama"
      - name: BaseRule.crawl
        where: src/sqlfluff/core/rules/base.py:518
        decides: "Rust yolu, crawler ile bağlam üretimi, _eval istisna yakalama, memory aktarımı"
      - name: BaseRule._process_lint_result
        where: src/sqlfluff/core/rules/base.py:709
        decides: "şablon-güvensiz fix atma, noqa maskesi, unparsable ebeveyn filtresi"
      - name: RuleSet.rule_reference_map
        where: src/sqlfluff/core/rules/base.py:1123
        decides: "code > name > group > alias çakışma çözümü"
      - name: RuleSet.get_rulepack
        where: src/sqlfluff/core/rules/base.py:1190
        decides: "config doğrulama, allow/deny genişletme, sıralı örnekleme, kural config'inin kwargs olarak dağıtımı"
    flow: "get_ruleset() (core/rules/__init__.py:33) -> hook.get_rules -> RuleSet.register -> get_rulepack(config) -> RulePack(rules, reference_map) -> Linter.lint_fix_parsed -> rule.crawl"
    change_points:
      - "Yeni kural niteliği (ör. yeni faz): BaseRule sınıf alanı + lint_fix_parsed faz seçimi (linter.py:514-518)"
      - "Yeni referans türü: rule_reference_map"
      - "Yeni kural config doğrulaması: get_configs_info hook'u + _validate_config_options (base.py:1021)"
  - module: src/sqlfluff/cli/commands.py
    functions:
